version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=blog
      - POSTGRES_USER=bloguser
      - POSTGRES_PASSWORD=blogpass

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - BLOG_DEBUG=False
      - BLOG_SECRET_KEY=django-insecure-prod-key-change-me
      - BLOG_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - BLOG_REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=postgres://bloguser:blogpass@db:5432/blog
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A settings worker -l info
    depends_on:
      - db
      - redis
    environment:
      - BLOG_REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=postgres://bloguser:blogpass@db:5432/blog
    volumes:
      - media_volume:/app/media

  celery_beat:
    build: .
    restart: unless-stopped
    command: celery -A settings beat -l info
    depends_on:
      - db
      - redis
    environment:
      - BLOG_REDIS_URL=redis://redis:6379/1

  flower:
    build: .
    restart: unless-stopped
    command: celery -A settings flower
    ports:
      - "5555:5555"
    depends_on:
      - db
      - redis
    environment:
      - BLOG_REDIS_URL=redis://redis:6379/1

volumes:
  postgres_data:
  static_volume:
  media_volume:
